name: Build Android IPTV player

on:
  push:
    paths:
      - "android-player/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android-player assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: russian-iptv-player-debug-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk

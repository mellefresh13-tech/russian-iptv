name: Update IPTV playlist

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      verify_streams:
        description: "Проверить доступность потоков (медленнее)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build playlist
        env:
          VERIFY_STREAMS: ${{ inputs.verify_streams || 'false' }}
        run: python3 scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u build-report.txt
          git diff --cached --quiet || git commit -m "chore: update IPTV playlist"
          git push
